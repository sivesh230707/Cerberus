<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="cerbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Outer precision geometric guide ring -->
  <circle cx="80" cy="80" r="72" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="80" cy="80" r="56" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Central Decision Nexus (Detect Core) -->
  <polygon points="80,62 95,71 95,89 80,98 65,89 65,71" fill="url(#coreGlow)" stroke="#0284C7" stroke-width="2"/>
  <circle cx="80" cy="80" r="4" fill="#0F172A"/>
